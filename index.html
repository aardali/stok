<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stok Takip</title>
<link rel="manifest" href='data:application/json,{"name":"Stok Takip","short_name":"Stok","display":"standalone","start_url":"."}'>
<style>
:root{--bg:#f2f3f6;--c:#fff;--t:#1b2233;--m:#667085;--b:#dfe3ea;--p:#2f4b9a;--pt:#fff;--w:#b42318}
[data-th=dark]{--bg:#0e1320;--c:#171e30;--t:#e6eaf4;--m:#8e9ab3;--b:#283250;--p:#8aa4ff;--pt:#0e1320;--w:#ff8a80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--c);border-bottom:1px solid var(--b);display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap}header small{color:var(--m)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--c);border-bottom:1px solid var(--b)}
nav button{flex:none;border:0;background:none;color:var(--m);padding:10px 14px;border-radius:8px;font:inherit;font-weight:600}nav button.on{background:var(--p);color:var(--pt)}
main{max-width:1100px;margin:0 auto;padding:12px}
.cd{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.g .cd{margin:0}.g small{color:var(--m)}.g b{display:block;font-size:24px}
label{display:block;margin:10px 0 4px;color:var(--m);font-size:13px}
input,select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
button{font:inherit;cursor:pointer}.bt,.sb{min-height:44px;padding:8px 16px;border-radius:8px;border:1px solid var(--b);background:var(--c);color:var(--t);font-weight:600}
.bt{background:var(--p);color:var(--pt);border-color:var(--p);margin-top:12px}.bt.w{background:var(--w);border-color:var(--w);color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;min-height:44px;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;font-weight:600}.tabs .on{background:var(--p);color:var(--pt);border-color:var(--p)}
.sc{display:flex;gap:8px;margin-top:10px}.sc button{flex:none;width:52px;border:1px solid var(--b);background:var(--c);border-radius:8px;font-size:20px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tw{overflow-x:auto;background:var(--c);border:1px solid var(--b);border-radius:10px;margin-bottom:12px}table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--b);white-space:nowrap}th{color:var(--m);font-weight:600;font-size:13px;background:var(--bg)}tr:last-child td{border:0}
a{color:var(--p);cursor:pointer;text-decoration:underline}h3{margin:16px 0 8px}small{color:var(--m)}
#pick{padding:10px;margin-top:10px;border-radius:8px;background:var(--bg);min-height:46px}
.mb{position:fixed;inset:0;background:#0009;z-index:9;display:flex;align-items:center;justify-content:center;padding:12px}.bx{background:var(--c);border-radius:12px;padding:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
#tt{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;display:none}
@media(min-width:700px){body{font-size:16px}}
</style></head><body>
<header><h1>Stok Takip</h1><small id="st"></small><button class="sb" onclick="kaydet()">Drive’a kaydet</button><button class="sb" onclick="tema()" title="Tema">◐</button></header>
<nav id="nv"></nav><main id="app"></main><div id="md"></div><div id="tt"></div>
<script>
const CLIENT_ID="BURAYA_YAZILACAK";
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4),f2=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=t=>{const d=new Date(t);return `${f2(d.getDate())}.${f2(d.getMonth()+1)}.${d.getFullYear()} ${f2(d.getHours())}:${f2(d.getMinutes())}`};
const iso=d=>d.getFullYear()+'-'+f2(d.getMonth()+1)+'-'+f2(d.getDate());
const TY={in:['Satın alma','Müşteri iadesi','Açılış stoku','Sayım fazlası','Transfer girişi','Diğer'],out:['Satış','Tedarikçiye iade','Fire/Hasar','Sayım eksiği','Transfer çıkışı','Numune/Hediye','Diğer']};
const fresh=()=>({p:[],v:[],l:[{id:'l1',n:'Dükkan'},{id:'l2',n:'Depo 1'},{id:'l3',n:'Depo 2'}],m:[],types:JSON.parse(JSON.stringify(TY)),meta:{theme:'auto',sync:0,dirty:0,low:3}});
let D,token,view='home',S={},ST={},tm;
const idb=()=>new Promise(r=>{const q=indexedDB.open('stok',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result)});
const load=async()=>{const d=await idb();return new Promise(r=>{const q=d.transaction('k').objectStore('k').get('d');q.onsuccess=()=>r(q.result)})};
const save=(dirty=1)=>{if(dirty)D.meta.dirty=Date.now();clearTimeout(tm);tm=setTimeout(async()=>{(await idb()).transaction('k','readwrite').objectStore('k').put(D,'d')},150);hdr()};
const calc=()=>{ST={};D.m.forEach(m=>{const k=m.v+'|'+m.l;ST[k]=(ST[k]||0)+m.q})};
const qty=(v,l)=>ST[v+'|'+l]||0,tot=v=>D.l.reduce((a,l)=>a+qty(v,l.id),0);
const P=id=>D.p.find(x=>x.id==id),V=id=>D.v.find(x=>x.id==id),Lr=id=>D.l.find(x=>x.id==id)?.n||'?';
const vr=v=>{const p=P(v.p);return `${p.b} ${p.m} · ${v.s} · ${v.c}`},vn=id=>esc(vr(V(id)));
const mv=(v,l,q,ty,n,r)=>D.m.push({id:uid(),t:Date.now(),v,l,q,ty,n:n||'',r:r||''});
const toast=t=>{const e=$('#tt');e.textContent=t;e.style.display='block';clearTimeout(e.h);e.h=setTimeout(()=>e.style.display='none',2800)};
const sel=(id,o,v,oc='')=>`<select id="${id}" onchange="${oc}">${o.map(([a,b])=>`<option value="${esc(a)}" ${a==v?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
const lo=(id,v,oc,all)=>sel(id,[...(all?[['','Tüm konumlar']]:[]),...D.l.map(l=>[l.id,l.n])],v,oc);
const tbl=(h,r,raw)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${raw?c:esc(c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${h.length}><small>Kayıt yok</small></td></tr>`}</table></div>`;
const modal=h=>$('#md').innerHTML=`<div class="mb"><div class="bx">${h}</div></div>`,closeM=()=>{$('#md').innerHTML='';stopCam()};
const dl=(n,t,ty='text/plain')=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()};
const stamp=()=>{const d=new Date();return `${d.getFullYear()}-${f2(d.getMonth()+1)}-${f2(d.getDate())}_${f2(d.getHours())}-${f2(d.getMinutes())}`};
const csv=(h,r)=>'\uFEFF'+[h,...r].map(x=>x.map(c=>{c=String(c??'');return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n');
const parse=t=>{t=t.replace(/^\uFEFF/,'');const sp=(t.split('\n')[0].match(/;/g)||[]).length?';':',',R=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'&&t[i+1]=='"'){c+='"';i++}else if(h=='"')q=0;else c+=h}else if(h=='"')q=1;else if(h==sp){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=h}if(c||r.length){r.push(c);R.push(r)}return R.filter(x=>x.some(y=>y.trim()))};
const gp=(b,m,g)=>{let p=D.p.find(x=>x.b.toLowerCase()==b.toLowerCase()&&x.m.toLowerCase()==m.toLowerCase());if(!p){p={id:uid(),b,m,g:g||''};D.p.push(p)}else if(g&&!p.g)p.g=g;return p};
const gv=(p,s,c)=>{let v=D.v.find(x=>x.p==p.id&&x.s.toLowerCase()==s.toLowerCase()&&x.c.toLowerCase()==c.toLowerCase());if(!v){v={id:uid(),p:p.id,s,c,k:[]};D.v.push(v)}return v};
const byCode=c=>D.v.find(v=>v.k.includes(c));
function tema(){D.meta.theme=document.documentElement.dataset.th=='dark'?'light':'dark';th();save(0)}
function th(){const t=D.meta.theme;document.documentElement.dataset.th=t=='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t}
function hdr(){$('#st').textContent=(token?'Drive bağlı':'Drive bağlı değil')+(D.meta.dirty&&D.meta.dirty>D.meta.sync?' · kaydedilmemiş değişiklik':'')}
const NV=[['home','Ana sayfa'],['count','Sayım'],['move','Hareket'],['find','Stok'],['rep','Raporlar'],['prod','Ürünler'],['set','Ayarlar']];
function go(v){view=v;render()}
function render(){calc();hdr();$('#nv').innerHTML=NV.map(([k,n])=>`<button class="${k==view?'on':''}" onclick="go('${k}')">${n}</button>`).join('');$('#app').innerHTML=VW[view]();(AF[view]||(()=>{}))();const e=$('#sc');if(e&&!S.nf)e.focus()}
/* barkod */
const scanBox=()=>`<div class="sc"><input id="sc" placeholder="Barkodu okutun veya yazıp Enter’a basın" onkeydown="if(event.key=='Enter'){onScan(this.value.trim());this.value=''}"><button onclick="cam(onScan)" title="Kamera">📷</button></div>`;
function onScan(c){if(!c)return;if(view=='find'){S.f.q=c;render();return}resolve(c,v=>{if(view=='move'){S.mv.v=v.id;render();$('#mQ').focus();$('#mQ').select()}else if(view=='count'){S.ct.v=v.id;render();$('#cQ').focus();$('#cQ').select()}})}
function resolve(c,cb){const v=byCode(c);if(v)return cb(v);newVar(c,cb)}
function newVar(c,cb){S.cb=cb;S.code=c;modal(`<h3>Yeni ürün: ${esc(c)}</h3><small>Bu barkod ilk kez okutuldu. Bilgileri bir kez girin.</small><label>Marka</label><input id="nb" list="bl"><label>Model</label><input id="nm"><label>Kategori</label><input id="ng" list="gl"><div class="row"><div><label>Beden</label><input id="ns"></div><div><label>Renk</label><input id="nc"></div></div>${dlists()}<button class="bt" onclick="saveVar()">Kaydet</button> <button class="sb" onclick="closeM()">Vazgeç</button>`)}
function dlists(){return `<datalist id="bl">${[...new Set(D.p.map(p=>p.b))].map(b=>`<option value="${esc(b)}">`).join('')}</datalist><datalist id="gl">${[...new Set(D.p.map(p=>p.g).filter(Boolean))].map(b=>`<option value="${esc(b)}">`).join('')}</datalist>`}
function saveVar(){const b=$('#nb').value.trim(),m=$('#nm').value.trim(),s=$('#ns').value.trim(),c=$('#nc').value.trim();if(!b||!m||!s||!c)return toast('Marka, model, beden ve renk gerekli');const v=gv(gp(b,m,$('#ng').value.trim()),s,c);if(!v.k.includes(S.code))v.k.push(S.code);save();closeM();render();S.cb(v)}
let cs,ci;async function cam(cb){if(!('BarcodeDetector' in window))return toast('Bu tarayıcı kamerayla okumayı desteklemiyor. Telefonda Chrome kullanın.');try{const bd=new BarcodeDetector();cs=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});modal(`<video id="vd" autoplay playsinline muted style="width:100%;border-radius:8px"></video><button class="bt" onclick="closeM()">Kapat</button>`);const v=$('#vd');v.srcObject=cs;ci=setInterval(async()=>{try{const r=await bd.detect(v);if(r.length){const c=r[0].rawValue;closeM();cb(c)}}catch(e){}},300)}catch(e){toast('Kamera açılamadı: izin verin')}}
function stopCam(){clearInterval(ci);cs?.getTracks().forEach(t=>t.stop());cs=null}
/* görünümler */
const mrow=m=>[dt(m.t),vn(m.v),esc(Lr(m.l)),m.q,esc(m.ty)];
const VW={home:()=>{const tq=D.m.reduce((a,m)=>a+m.q,0);return `<div class="g">${[['Toplam stok',tq],['Çeşit',D.v.length],['Model',D.p.length],['Hareket',D.m.length]].map(([a,b])=>`<div class="cd"><small>${a}</small><b>${b}</b></div>`).join('')}</div><div class="g">${D.l.map(l=>`<div class="cd"><small>${esc(l.n)}</small><b>${D.v.reduce((a,v)=>a+qty(v.id,l.id),0)}</b></div>`).join('')}</div><h3>Son hareketler</h3>`+tbl(['Tarih','Ürün','Konum','Adet','Tür'],D.m.slice(-8).reverse().map(mrow),1)},
move:()=>{const m=S.mv||(S.mv={d:'in'});m.l=m.l||D.l[0].id;m.l2=m.l2||D.l[1]?.id;m.t=m.t||TY.in[0]&&D.types[m.d]?.[0];return `<div class="tabs">${[['in','Giriş'],['out','Çıkış'],['tr','Transfer']].map(([k,n])=>`<button class="${m.d==k?'on':''}" onclick="S.mv.d='${k}';S.mv.v=null;S.mv.t=null;render()">${n}</button>`).join('')}</div><div class="cd"><label>${m.d=='tr'?'Nereden':'Konum'}</label>${lo('mL',m.l,"S.mv.l=this.value;render()")}${m.d=='tr'?`<label>Nereye</label>${lo('mL2',m.l2,"S.mv.l2=this.value")}`:`<label>Tür</label>${sel('mT',D.types[m.d].map(t=>[t,t]),m.t,"S.mv.t=this.value")}`}${scanBox()}<div id="pick">${m.v?`<b>${vn(m.v)}</b><br><small>Bu konumda stok: ${qty(m.v,m.l)}</small>`:'<small>Barkod okutun</small>'}</div><label>Adet</label><input id="mQ" type="number" min="1" value="1" onkeydown="if(event.key=='Enter')doMove()"><label>Not</label><input id="mN"><button class="bt" onclick="doMove()">Kaydet</button></div><h3>Son hareketler</h3>`+tbl(['Tarih','Ürün','Konum','Adet','Tür'],D.m.slice(-8).reverse().map(mrow),1)},
count:()=>{const c=S.ct||(S.ct={l:D.l[0].id,it:{},z:false});if(c.diff)return diffV();const ks=Object.keys(c.it).reverse();return `<div class="cd"><label>Sayılan konum</label>${lo('cL',c.l,"S.ct.l=this.value;S.ct.it={};render()")}${scanBox()}<div id="pick">${c.v?`<b>${vn(c.v)}</b>`:'<small>Barkod okutun</small>'}</div><label>Adet (sayıma eklenir)</label><input id="cQ" type="number" min="1" value="1" onkeydown="if(event.key=='Enter')addC()"><button class="bt" onclick="addC()">Ekle</button></div><h3>Sayılanlar (${ks.length})</h3>`+tbl(['Ürün','Sayılan','Sistem',''],ks.map(k=>[vn(k),c.it[k],qty(k,c.l),`<a onclick="delete S.ct.it['${k}'];render()">sil</a>`]),1)+`<label><input type="checkbox" style="width:auto;min-height:0" ${c.z?'checked':''} onchange="S.ct.z=this.checked"> Sayılmayanları sıfır kabul et</label><button class="bt" onclick="endC()">Sayımı bitir</button>`},
find:()=>{const f=S.f||(S.f={q:'',l:'',b:'',c:'',s:''});return `<div class="cd"><input id="fq" placeholder="Ara: marka, model, barkod, beden, renk" value="${esc(f.q)}" oninput="S.f.q=this.value;fres()">${scanBox()}<div class="row"><div><label>Konum</label>${lo('fl',f.l,"S.f.l=this.value;fres()",1)}</div><div><label>Marka</label>${sel('fb',[['','Tümü'],...[...new Set(D.p.map(p=>p.b))].sort().map(x=>[x,x])],f.b,"S.f.b=this.value;fres()")}</div><div><label>Kategori</label>${sel('fc',[['','Tümü'],...[...new Set(D.p.map(p=>p.g).filter(Boolean))].sort().map(x=>[x,x])],f.c,"S.f.c=this.value;fres()")}</div><div><label>Durum</label>${sel('fs',[['','Tümü'],['var','Stokta var'],['sifir','Sıfır'],['az','Az kalan']],f.s,"S.f.s=this.value;fres()")}</div></div></div><div id="fr"></div>`},
rep:()=>{const r=S.r||(S.r={t:'hareket',from:'',to:'',d:'',ty:'',l:'',q:'',g:'m'});const mvR=['hareket','satis','sayim'].includes(r.t);return `<div class="cd"><label>Rapor</label>${sel('rt',[['hareket','Hareket raporu'],['satis','Satış raporu'],['stok','Stok durumu'],['az','Az kalan / biten'],['sayim','Sayım farkları']],r.t,"S.r.t=this.value;render()")}${mvR?`<div class="tabs" style="margin-top:10px">${[['d','Bugün'],['w','Bu hafta'],['m','Bu ay']].map(([k,n])=>`<button onclick="rng('${k}')">${n}</button>`).join('')}</div><div class="row"><div><label>Başlangıç</label><input type="date" value="${r.from}" onchange="S.r.from=this.value;rres()"></div><div><label>Bitiş</label><input type="date" value="${r.to}" onchange="S.r.to=this.value;rres()"></div>${r.t=='hareket'?`<div><label>Yön</label>${sel('rd',[['','Giriş ve çıkış'],['in','Sadece giriş'],['out','Sadece çıkış']],r.d,"S.r.d=this.value;rres()")}</div><div><label>Tür</label>${sel('ry',[['','Tüm türler'],...[...new Set([...D.types.in,...D.types.out])].map(x=>[x,x])],r.ty,"S.r.ty=this.value;rres()")}</div>`:''}${r.t=='satis'?`<div><label>Grupla</label>${sel('rg',[['m','Model'],['s','Model + beden'],['c','Model + beden + renk']],r.g,"S.r.g=this.value;rres()")}</div>`:''}</div>`:''}${r.t!='az'?`<div class="row"><div><label>Konum</label>${lo('rl',r.l,"S.r.l=this.value;rres()",1)}</div><div><label>Ürün ara</label><input value="${esc(r.q)}" oninput="S.r.q=this.value;rres()"></div></div>`:''}</div><div id="rr"></div>`},
prod:()=>`<div class="cd"><b>Yeni model (toplu beden-renk)</b><label>Marka</label><input id="pB" list="bl"><label>Model</label><input id="pM"><label>Kategori</label><input id="pG" list="gl"><label>Bedenler (virgülle)</label><input id="pS" placeholder="S, M, L, XL"><label>Renkler (virgülle)</label><input id="pC" placeholder="Lacivert, Siyah">${dlists()}<button class="bt" onclick="bulk()">Oluştur</button></div><h3>Modeller (${D.p.length})</h3><input id="pq" placeholder="Model ara" oninput="plist()"><div id="pl" style="margin-top:10px"></div>`,
set:()=>`<div class="cd"><b>Görünüm</b><label>Tema</label>${sel('sT',[['auto','Otomatik'],['light','Açık'],['dark','Koyu']],D.meta.theme,"D.meta.theme=this.value;th();save(0)")}<label>Az kalan eşiği (adet)</label><input type="number" min="0" value="${D.meta.low}" onchange="D.meta.low=+this.value;save(0)"></div>
<div class="cd"><b>Hareket türleri</b>${['in','out'].map(d=>`<label>${d=='in'?'Giriş':'Çıkış'}</label><div>${D.types[d].map((t,i)=>`<span class="sb" style="display:inline-block;min-height:0;margin:2px;padding:4px 10px">${esc(t)} <a onclick="delT('${d}',${i})">×</a></span>`).join('')}<a onclick="addT('${d}')">+ ekle</a></div>`).join('')}</div>
<div class="cd"><b>Google Drive</b><p><small>Her kayıt Drive’a tarih-saatli yeni bir dosya olarak yazılır, eskiler silinmez.</small></p><button class="sb" onclick="kaydet()">Şimdi eşle</button> <button class="sb" onclick="bkList()">Drive yedekleri</button></div>
<div class="cd"><b>Yedek ve veri</b><p><button class="sb" onclick="dl('stok_yedek_'+stamp()+'.json',JSON.stringify(D),'application/json')">Yedeği indir</button> <label class="sb" style="display:inline-block;margin:0">Yedekten geri yükle<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label></p><p><button class="sb" onclick="exp('u')">Ürünleri dışa aktar</button> <button class="sb" onclick="exp('s')">Stoku dışa aktar</button> <button class="sb" onclick="exp('h')">Hareketleri dışa aktar</button></p><p><label class="sb" style="display:inline-block;margin:0">Excel/CSV içe aktar<input type="file" accept=".csv,.txt" hidden onchange="imp(this.files[0])"></label> <button class="sb" onclick="dl('sablon.csv',csv(['marka','model','kategori','beden','renk','barkod','konum','adet'],[['Marka X','Polo Yaka','Tişört','M','Lacivert','8680000000001','Depo 1','12']]))">Şablon indir</button></p><small>Excel dosyanızı “CSV (noktalı virgülle ayrılmış)” olarak kaydedip yükleyin.</small></div>
<div class="cd"><b>Sistemi sıfırla</b><p><small>Tüm ürün, stok ve hareketleri siler. Önce otomatik yedek alınır.</small></p><button class="bt w" onclick="reset()">Sıfırla</button></div>`};
const AF={find:()=>fres(),rep:()=>rres(),prod:()=>plist(),move:()=>{},count:()=>{}};
/* işlemler */
function doMove(){const m=S.mv,q=+$('#mQ').value,n=$('#mN').value;if(!m.v)return toast('Önce ürün okutun');if(!(q>0))return toast('Adet girin');
if(m.d=='tr'){if(m.l==m.l2)return toast('Konumlar aynı');if(qty(m.v,m.l)<q&&!confirm('Kaynak konumda yeterli stok yok. Devam edilsin mi?'))return;const r=uid();mv(m.v,m.l,-q,'Transfer çıkışı',n,r);mv(m.v,m.l2,q,'Transfer girişi',n,r)}
else{if(m.d=='out'&&qty(m.v,m.l)<q&&!confirm('Stok yetersiz, negatife düşecek. Devam edilsin mi?'))return;mv(m.v,m.l,m.d=='in'?q:-q,m.t,n)}
m.v=null;save();render();toast('Kaydedildi')}
function addC(){const c=S.ct,q=+$('#cQ').value;if(!c.v)return toast('Önce ürün okutun');if(!(q>0))return toast('Adet girin');c.it[c.v]=(c.it[c.v]||0)+q;c.v=null;render()}
function endC(){const c=S.ct,d=[];Object.keys(c.it).forEach(k=>{const f=c.it[k]-qty(k,c.l);d.push([k,c.it[k],qty(k,c.l),f])});if(c.z)D.v.forEach(v=>{if(!(v.id in c.it)&&qty(v.id,c.l)>0)d.push([v.id,0,qty(v.id,c.l),-qty(v.id,c.l)])});c.diff=d.filter(x=>x[3]!=0);c.same=d.length-c.diff.length;render()}
function diffV(){const c=S.ct;return `<h3>Sayım sonucu: ${esc(Lr(c.l))}</h3><small>${c.same} ürün sistemle aynı çıktı.</small>`+tbl(['Ürün','Sayılan','Sistem','Fark'],c.diff.map(x=>[vn(x[0]),x[1],x[2],(x[3]>0?'+':'')+x[3]]),1)+`<button class="bt" onclick="okC()">Farkları stoka işle</button> <button class="sb" onclick="S.ct.diff=null;render()">Geri dön</button>`}
function okC(){const c=S.ct;c.diff.forEach(x=>mv(x[0],c.l,x[3],x[3]>0?'Sayım fazlası':'Sayım eksiği','Sayım'));S.ct=null;save();render();toast('Sayım işlendi')}
function fres(){const f=S.f,q=f.q.toLowerCase().split(/\s+/).filter(Boolean);const r=D.v.filter(v=>{const p=P(v.p),h=(p.b+' '+p.m+' '+p.g+' '+v.s+' '+v.c+' '+v.k.join(' ')).toLowerCase();if(!q.every(w=>h.includes(w)))return false;if(f.b&&p.b!=f.b||f.c&&p.g!=f.c)return false;const t=f.l?qty(v.id,f.l):tot(v.id);return !(f.s=='var'&&t<=0||f.s=='sifir'&&t!=0||f.s=='az'&&!(t>0&&t<=D.meta.low))});
$('#fr').innerHTML=`<small>${r.length} sonuç${r.length>150?' (ilk 150 gösteriliyor)':''}</small>`+tbl(['Ürün','Beden','Renk',...D.l.map(l=>esc(l.n)),'Toplam'],r.slice(0,150).map(v=>{const p=P(v.p);return [`<a onclick="card('${p.id}')">${esc(p.b+' '+p.m)}</a>`,esc(v.s),esc(v.c),...D.l.map(l=>qty(v.id,l.id)),tot(v.id)]}),1)}
function card(id){const p=P(id),vs=D.v.filter(v=>v.p==id),ss=[...new Set(vs.map(v=>v.s))],cs=[...new Set(vs.map(v=>v.c))],l=S.f?.l;modal(`<h3>${esc(p.b+' '+p.m)}</h3><small>${l?esc(Lr(l)):'Tüm konumlar'}</small>`+tbl(['Renk \\ Beden',...ss.map(esc)],cs.map(c=>[esc(c),...ss.map(s=>{const v=vs.find(x=>x.s==s&&x.c==c);return v?(l?qty(v.id,l):tot(v.id)):'–'})]),1)+`<button class="sb" onclick="closeM()">Kapat</button>`)}
function rng(k){const n=new Date(),s=new Date(n);if(k=='w')s.setDate(n.getDate()-((n.getDay()+6)%7));if(k=='m')s.setDate(1);S.r.from=iso(s);S.r.to=iso(n);render()}
function fm(){const r=S.r,q=r.q.toLowerCase().split(/\s+/).filter(Boolean),a=r.from?new Date(r.from+'T00:00').getTime():0,b=r.to?new Date(r.to+'T23:59:59').getTime():1e15,ty=r.t=='satis'?['Satış']:r.t=='sayim'?['Sayım fazlası','Sayım eksiği']:r.ty?[r.ty]:null;return D.m.filter(m=>m.t>=a&&m.t<=b&&(!ty||ty.includes(m.ty))&&(!r.l||m.l==r.l)&&(!r.d||(r.d=='in')==(m.q>0))&&q.every(w=>vr(V(m.v)).toLowerCase().includes(w)))}
function rres(){const r=S.r;let h,rows,sum='';calc();
if(r.t=='hareket'||r.t=='sayim'){const m=fm().sort((a,b)=>b.t-a.t);h=['Tarih','Ürün','Konum','Tür','Adet','Not'];rows=m.map(x=>[dt(x.t),vr(V(x.v)),Lr(x.l),x.ty,x.q,x.n]);const i=m.filter(x=>x.q>0).reduce((a,x)=>a+x.q,0),o=m.filter(x=>x.q<0).reduce((a,x)=>a-x.q,0);sum=`Giriş <b>${i}</b> · Çıkış <b>${o}</b> · Net <b>${i-o}</b> · ${m.length} kayıt`}
else if(r.t=='satis'){const g={};fm().forEach(x=>{const v=V(x.v),p=P(v.p),k=p.b+' '+p.m+(r.g!='m'?' · '+v.s:'')+(r.g=='c'?' · '+v.c:'');g[k]=(g[k]||0)-x.q});h=['Ürün','Satılan adet'];rows=Object.entries(g).sort((a,b)=>b[1]-a[1]);sum=`Toplam satış: <b>${rows.reduce((a,x)=>a+x[1],0)}</b> adet`}
else{const q=r.q.toLowerCase().split(/\s+/).filter(Boolean);h=['Ürün','Beden','Renk',...D.l.map(l=>l.n),'Toplam'];rows=D.v.filter(v=>q.every(w=>vr(v).toLowerCase().includes(w))).map(v=>[`${P(v.p).b} ${P(v.p).m}`,v.s,v.c,...D.l.map(l=>qty(v.id,l.id)),tot(v.id)]);if(r.t=='az'){const e=D.meta.low;rows=rows.filter(x=>x[x.length-1]<=e);sum=`${e} ve altı: <b>${rows.length}</b> çeşit`}else{if(r.l){const i=D.l.findIndex(l=>l.id==r.l);rows=rows.filter(x=>x[3+i]!=0)}sum=`Toplam: <b>${rows.reduce((a,x)=>a+x[x.length-1],0)}</b> adet`}}
S.rep={h,rows};$('#rr').innerHTML=`<p>${sum}</p><button class="sb" onclick="dl('rapor_'+stamp()+'.csv',csv(S.rep.h,S.rep.rows))">Excel/CSV indir</button><div style="height:10px"></div>`+tbl(h.map(esc),rows.slice(0,300))+(rows.length>300?`<small>İlk 300 satır gösteriliyor, tamamı dışa aktarımda.</small>`:'')}
function bulk(){const b=$('#pB').value.trim(),m=$('#pM').value.trim(),ss=$('#pS').value.split(',').map(x=>x.trim()).filter(Boolean),cs=$('#pC').value.split(',').map(x=>x.trim()).filter(Boolean);if(!b||!m||!ss.length||!cs.length)return toast('Marka, model, beden ve renk girin');const p=gp(b,m,$('#pG').value.trim());ss.forEach(s=>cs.forEach(c=>gv(p,s,c)));save();render();toast(ss.length*cs.length+' çeşit hazır')}
function plist(){const q=($('#pq')?.value||'').toLowerCase();const r=D.p.filter(p=>(p.b+' '+p.m).toLowerCase().includes(q)).slice(0,100);$('#pl').innerHTML=tbl(['Marka','Model','Kategori','Çeşit',''],r.map(p=>[esc(p.b),esc(p.m),esc(p.g),D.v.filter(v=>v.p==p.id).length,`<a onclick="pedit('${p.id}')">barkodlar</a>`]),1)}
function pedit(id){const vs=D.v.filter(v=>v.p==id);modal(`<h3>${esc(P(id).b+' '+P(id).m)}</h3><small>Barkodları virgülle ayırarak yazın.</small>`+vs.map(v=>`<label>${esc(v.s+' · '+v.c)}</label><input data-v="${v.id}" value="${esc(v.k.join(', '))}">`).join('')+`<button class="bt" onclick="psave()">Kaydet</button> <button class="sb" onclick="closeM()">Kapat</button>`)}
function psave(){document.querySelectorAll('[data-v]').forEach(i=>V(i.dataset.v).k=i.value.split(',').map(x=>x.trim()).filter(Boolean));save();closeM();toast('Kaydedildi')}
function addT(d){const t=prompt('Yeni tür adı');if(t&&t.trim()){D.types[d].push(t.trim());save(0);render()}}
function delT(d,i){if(confirm('Bu tür listeden kaldırılsın mı? Eski kayıtlar korunur.')){D.types[d].splice(i,1);save(0);render()}}
function exp(k){calc();if(k=='u')dl('urunler.csv',csv(['marka','model','kategori','beden','renk','barkod'],D.v.map(v=>[P(v.p).b,P(v.p).m,P(v.p).g,v.s,v.c,v.k.join(',')])));if(k=='s')dl('stok.csv',csv(['marka','model','beden','renk','barkod',...D.l.map(l=>l.n),'toplam'],D.v.map(v=>[P(v.p).b,P(v.p).m,v.s,v.c,v.k[0]||'',...D.l.map(l=>qty(v.id,l.id)),tot(v.id)])));if(k=='h')dl('hareketler.csv',csv(['tarih','marka','model','beden','renk','konum','tür','adet','not'],D.m.map(m=>{const v=V(m.v),p=P(v.p);return [dt(m.t),p.b,p.m,v.s,v.c,Lr(m.l),m.ty,m.q,m.n]})))}
async function imp(f){if(!f)return;const R=parse(await f.text()),H=R.shift().map(x=>x.trim().toLowerCase()),ix=n=>H.indexOf(n),err=[];let ok=0;if(['marka','model','beden','renk'].some(n=>ix(n)<0))return toast('Başlıklar şablondakiyle aynı olmalı');
R.forEach((r,i)=>{const g=n=>(r[ix(n)]||'').trim(),b=g('marka'),m=g('model'),s=g('beden'),c=g('renk'),k=g('barkod'),lk=g('konum'),a=g('adet');if(!b||!m||!s||!c)return err.push(`Satır ${i+2}: marka/model/beden/renk eksik`);let l,n=0;if(a){n=+a.replace(',','.');if(!(n>0))return err.push(`Satır ${i+2}: adet geçersiz`);l=D.l.find(x=>x.n.toLowerCase()==lk.toLowerCase());if(!l)return err.push(`Satır ${i+2}: konum bulunamadı (${lk})`)}const v=gv(gp(b,m,g('kategori')),s,c);if(k&&!v.k.includes(k)){if(byCode(k))return err.push(`Satır ${i+2}: barkod başka üründe`);v.k.push(k)}if(n)mv(v.id,l.id,n,'Açılış stoku','İçe aktarım');ok++});
save();render();modal(`<h3>İçe aktarım bitti</h3><p>${ok} satır alındı, ${err.length} satır atlandı.</p>${err.slice(0,30).map(e=>`<div><small>${esc(e)}</small></div>`).join('')}<button class="bt" onclick="closeM()">Tamam</button>`)}
async function restore(f){if(!f)return;try{const d=JSON.parse(await f.text());if(!['p','v','l','m'].every(k=>Array.isArray(d[k])))throw 0;if(!confirm(`Yedekte ${d.p.length} model, ${d.v.length} çeşit, ${d.m.length} hareket var. Mevcut veri bunun yerine geçecek. Devam edilsin mi?`))return;dl('onceki_'+stamp()+'.json',JSON.stringify(D));D=d;D.meta=Object.assign({theme:'auto',sync:0,dirty:0,low:3},D.meta);save();render();toast('Geri yüklendi')}catch(e){toast('Bu dosya geçerli bir yedek değil')}}
async function reset(){if(!confirm('Tüm veriler silinecek. Emin misiniz?'))return;if(prompt('Onay için SIFIRLA yazın')!='SIFIRLA')return toast('Vazgeçildi');dl('sifirlama_oncesi_'+stamp()+'.json',JSON.stringify(D));if(token){try{await upload()}catch(e){}}const t=D.meta.theme;D=fresh();D.meta.theme=t;S={};save();render();toast('Sistem sıfırlandı')}
/* drive */
const gl=()=>new Promise((res,rej)=>{if(window.google?.accounts)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=rej;document.head.appendChild(s)});
async function login(){if(CLIENT_ID.startsWith('BURAYA'))throw Error('Google Client ID henüz eklenmemiş');await gl();return new Promise((res,rej)=>google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',callback:r=>{if(r.error)return rej(r);token=r.access_token;hdr();res()}}).requestAccessToken())}
const api=(u,o={})=>fetch(u,{...o,headers:{Authorization:'Bearer '+token}}).then(r=>{if(!r.ok)throw Error('Drive '+r.status);return r});
const files=async()=>(await(await api('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent("name contains 'stok_' and trashed=false")+'&orderBy=createdTime desc&pageSize=30&fields=files(id,name,createdTime)')).json()).files||[];
async function upload(){const fd=new FormData();fd.append('metadata',new Blob([JSON.stringify({name:`stok_${stamp()}.json`,mimeType:'application/json'})],{type:'application/json'}));fd.append('file',new Blob([JSON.stringify(D)],{type:'application/json'}));const j=await(await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,createdTime',{method:'POST',body:fd})).json();D.meta.sync=Date.parse(j.createdTime);D.meta.dirty=0;save(0)}
async function pull(id,t){if(D.meta.dirty)dl('onceki_'+stamp()+'.json',JSON.stringify(D));const d=await(await api('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media')).json();const th=D.meta.theme;D=d;D.meta=Object.assign({low:3},D.meta,{theme:th,sync:t,dirty:0});S={};save(0);render();toast('Drive sürümü yüklendi')}
async function kaydet(){try{if(!token)await login();const f=(await files())[0],t=f?Date.parse(f.createdTime):0;
if(t>D.meta.sync){if(D.meta.dirty){if(confirm('Drive’da bu cihazda olmayan daha yeni bir sürüm var ve bu cihazda da kaydedilmemiş değişiklik var.\n\nTamam: Drive sürümünü yükle (bu cihazdaki önce yedek olarak indirilir)\nİptal: bu cihazdakini koru, Drive’a yeni sürüm olarak yaz'))return await pull(f.id,t)}else if(confirm('Drive’da daha yeni bir sürüm var. Yüklensin mi?'))return await pull(f.id,t)}
if(!D.meta.dirty&&D.meta.sync)return toast('Değişiklik yok');await upload();toast('Drive’a kaydedildi')}catch(e){toast('Drive: '+(e.message||e.error||'hata'))}}
async function bkList(){try{if(!token)await login();const f=await files();modal(`<h3>Drive yedekleri</h3>`+tbl(['Dosya','Tarih',''],f.map(x=>[esc(x.name),dt(Date.parse(x.createdTime)),`<a onclick="bkLoad('${x.id}','${x.createdTime}')">yükle</a>`]),1)+`<button class="sb" onclick="closeM()">Kapat</button>`)}catch(e){toast('Drive: '+(e.message||e.error||'hata'))}}
async function bkLoad(id,t){if(!confirm('Bu yedek yüklensin mi? Şimdiki veri önce cihaza yedek olarak indirilir.'))return;dl('onceki_'+stamp()+'.json',JSON.stringify(D));closeM();try{await pull(id,Date.parse(t))}catch(e){toast('Drive: '+e.message)}}
(async()=>{D=await load()||fresh();D.meta=Object.assign({theme:'auto',sync:0,dirty:0,low:3},D.meta);th();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',th);render()})();
</script></body></html>
