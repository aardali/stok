<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stok Takip</title>

<style>
:root{--bg:#f2f3f6;--c:#fff;--t:#1b2233;--m:#667085;--b:#dfe3ea;--p:#2f4b9a;--pt:#fff;--w:#b42318}
[data-th=dark]{--bg:#0e1320;--c:#171e30;--t:#e6eaf4;--m:#8e9ab3;--b:#283250;--p:#8aa4ff;--pt:#0e1320;--w:#ff8a80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--c);border-bottom:1px solid var(--b);display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}

main{max-width:1100px;margin:0 auto;padding:12px}
.cd{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:12px}

label{display:block;margin:10px 0 4px;color:var(--m);font-size:13px}
input,select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
button{font:inherit;cursor:pointer}.bt,.sb{min-height:44px;padding:8px 16px;border-radius:8px;border:1px solid var(--b);background:var(--c);color:var(--t);font-weight:600}
.bt{background:var(--p);color:var(--pt);border-color:var(--p);margin-top:12px}.bt.w{background:var(--w);border-color:var(--w);color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;min-height:44px;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;font-weight:600}.tabs .on{background:var(--p);color:var(--pt);border-color:var(--p)}
.sc{display:flex;gap:8px;margin-top:10px}.sc button{flex:none;width:52px;border:1px solid var(--b);background:var(--c);border-radius:8px;font-size:20px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tw{overflow-x:auto;background:var(--c);border:1px solid var(--b);border-radius:10px;margin-bottom:12px}table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--b);white-space:nowrap}th{color:var(--m);font-weight:600;font-size:13px;background:var(--bg)}tr:last-child td{border:0}
a{color:var(--p);cursor:pointer;text-decoration:underline}h3{margin:16px 0 8px}small{color:var(--m)}
#pick{padding:10px;margin-top:10px;border-radius:8px;background:var(--bg);min-height:46px}
.mb{position:fixed;inset:0;background:#0009;z-index:9;display:flex;align-items:center;justify-content:center;padding:12px}.bx{background:var(--c);border-radius:12px;padding:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
#tt{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;display:none}
@media(min-width:700px){body{font-size:16px}}
label.sb,label.ck{color:var(--t);font-size:inherit;margin:0;display:inline-flex;align-items:center;gap:8px}.ck input{width:auto;min-height:0}
[data-th=dark]{color-scheme:dark}details.cd summary{cursor:pointer}details ol{margin:8px 0 0 18px;padding:0}
.pgn{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-4px 0 12px}.pgn select{width:auto}.mo{display:none}
@media(min-width:900px){nav{position:fixed;left:0;top:58px;bottom:0;width:190px;flex-direction:column;border-right:1px solid var(--b);border-bottom:0}nav button{text-align:left}main{margin-left:190px;max-width:none}}
@media(max-width:899px){nav{position:fixed;bottom:0;left:0;right:0;z-index:6;border-top:1px solid var(--b);border-bottom:0;padding:4px;gap:2px}nav button{flex:1;padding:10px 2px;font-size:13px}nav .x{display:none}.mo{display:block}main{padding-bottom:84px}}
header h1{color:var(--p);letter-spacing:-.2px}h3{font-size:16px}.cd{box-shadow:0 1px 2px rgba(16,24,40,.06)}
nav button{display:flex;align-items:center;gap:10px}nav svg{width:20px;height:20px;flex:none}
.bd{display:inline-block;min-width:34px;text-align:center;padding:2px 10px;border-radius:99px;font-weight:600;font-size:13px}
.bd.ok{background:#16a34a22;color:#15803d}.bd.lo{background:#d9770622;color:#b45309}.bd.no{background:#dc262622;color:#b42318}
[data-th=dark] .bd.ok{color:#4ade80}[data-th=dark] .bd.lo{color:#fbbf24}[data-th=dark] .bd.no{color:#ff8a80}
.es{text-align:center;padding:32px 16px}.es svg{width:48px;height:48px;color:var(--p)}
@media(max-width:899px){nav button{flex-direction:column;gap:2px;font-size:11px;align-items:center;justify-content:center}
.tw{background:none;border:0}.tw table,.tw tbody,.tw tr,.tw td{display:block;width:100%}.tw tr:first-child:has(th){display:none}
.tw tr{background:var(--c);border:1px solid var(--b);border-radius:10px;margin-bottom:8px;padding:8px 12px}
.tw td{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border:0;white-space:normal;text-align:right}
.tw td::before{content:attr(data-l);color:var(--m);font-size:13px;text-align:left}.tw td:first-child{font-weight:600;text-align:left}.tw td:first-child::before{display:none}}
</style></head><body>
<header><h1>Stok Takip <small>v3</small></h1><small id="st"></small><button class="sb" onclick="kaydet()">Drive’a kaydet</button><button class="sb" onclick="tema()" title="Tema">◐</button><button class="sb" onclick="logout()">Çıkış</button></header>
<nav id="nv"></nav><main id="app"></main><div id="md"></div><div id="tt"></div><div id="lg"></div>
<script>
const CLIENT_ID="811559386962-1s70mducrk8v3d3gh7hgc0007mfpmccp.apps.googleusercontent.com";
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4),f2=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=t=>{const d=new Date(t);return `${f2(d.getDate())}.${f2(d.getMonth()+1)}.${d.getFullYear()} ${f2(d.getHours())}:${f2(d.getMinutes())}`};
const iso=d=>d.getFullYear()+'-'+f2(d.getMonth()+1)+'-'+f2(d.getDate());
const TY={in:['Satın alma','Müşteri iadesi','Açılış stoku','Sayım fazlası','Transfer girişi','Diğer'],out:['Satış','Tedarikçiye iade','Fire/Hasar','Sayım eksiği','Transfer çıkışı','Numune/Hediye','Diğer']};
const fresh=()=>({p:[],v:[],l:[{id:'l1',n:'Dükkan'},{id:'l2',n:'Depo 1'},{id:'l3',n:'Depo 2'}],m:[],types:JSON.parse(JSON.stringify(TY)),meta:{theme:'auto',sync:0,dirty:0,low:3}});
let D,token,view='home',S={},ST={},tm,PM,VM;
const idb=()=>new Promise(r=>{const q=indexedDB.open('stok',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result)});
const load=async()=>{const d=await idb();return new Promise(r=>{const q=d.transaction('k').objectStore('k').get('d');q.onsuccess=()=>r(q.result)})};
const save=(dirty=1)=>{if(dirty){D.meta.dirty=Date.now();D.meta.chg=(D.meta.chg||0)+1;if(D.meta.chg%25==0)toast('25 değişiklik yapıldı, Drive’a kaydetmeyi unutmayın')}clearTimeout(tm);tm=setTimeout(async()=>{(await idb()).transaction('k','readwrite').objectStore('k').put(D,'d')},150);hdr()};
const calc=()=>{PM=new Map(D.p.map(p=>[p.id,p]));VM=new Map(D.v.map(v=>[v.id,v]));ST={};D.m.forEach(m=>{const k=m.v+'|'+m.l;ST[k]=(ST[k]||0)+m.q})};
const qty=(v,l)=>ST[v+'|'+l]||0,tot=v=>D.l.reduce((a,l)=>a+qty(v,l.id),0);
const P=id=>PM?.get(id)||D.p.find(x=>x.id==id),V=id=>VM?.get(id)||D.v.find(x=>x.id==id),Lr=id=>D.l.find(x=>x.id==id)?.n||'?';
const vr=v=>{const p=P(v.p);return `${p.b} ${p.m} · ${v.s} · ${v.c}`},vn=id=>V(id)?esc(vr(V(id))):'(silinmiş)';
const mv=(v,l,q,ty,n,r)=>D.m.push({id:uid(),t:S.dt||Date.now(),v,l,q,ty,n:n||'',r:r||''});
const toast=t=>{const e=$('#tt');e.textContent=t;e.style.display='block';clearTimeout(e.h);e.h=setTimeout(()=>e.style.display='none',2800)};
const sel=(id,o,v,oc='')=>`<select id="${id}" onchange="${oc}">${o.map(([a,b])=>`<option value="${esc(a)}" ${a==v?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
const lo=(id,v,oc,all)=>sel(id,[...(all?[['','Tüm konumlar']]:[]),...D.l.map(l=>[l.id,l.n])],v,oc);
const tbl=(h,r,raw)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map((c,j)=>`<td data-l="${esc(String(h[j]||'').replace(/<[^>]*>/g,'').replace(/[▲▼]/g,'').trim())}">${raw?c:esc(c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${h.length}><small>Kayıt yok</small></td></tr>`}</table></div>`;
const modal=h=>$('#md').innerHTML=`<div class="mb"><div class="bx">${h}</div></div>`,closeM=()=>{$('#md').innerHTML='';stopCam()};
const dl=(n,t,ty='text/plain')=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()};
const stamp=()=>{const d=new Date();return `${d.getFullYear()}-${f2(d.getMonth()+1)}-${f2(d.getDate())}_${f2(d.getHours())}-${f2(d.getMinutes())}`};
const csv=(h,r)=>'\uFEFF'+[h,...r].map(x=>x.map(c=>{c=String(c??'');return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n');
const parse=t=>{t=t.replace(/^\uFEFF/,'');const sp=(t.split('\n')[0].match(/;/g)||[]).length?';':',',R=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'&&t[i+1]=='"'){c+='"';i++}else if(h=='"')q=0;else c+=h}else if(h=='"')q=1;else if(h==sp){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=h}if(c||r.length){r.push(c);R.push(r)}return R.filter(x=>x.some(y=>y.trim()))};
const gp=(b,m,g)=>{let p=D.p.find(x=>x.b.toLowerCase()==b.toLowerCase()&&x.m.toLowerCase()==m.toLowerCase());if(!p){p={id:uid(),b,m,g:g||''};D.p.push(p)}else if(g&&!p.g)p.g=g;return p};
const gv=(p,s,c)=>{let v=D.v.find(x=>x.p==p.id&&x.s.toLowerCase()==s.toLowerCase()&&x.c.toLowerCase()==c.toLowerCase());if(!v){v={id:uid(),p:p.id,s,c,k:[]};D.v.push(v)}return v};
const byCode=c=>D.v.find(v=>v.k.includes(c));
function tema(){D.meta.theme=document.documentElement.dataset.th=='dark'?'light':'dark';th();save(0)}
function th(){const t=D.meta.theme;document.documentElement.dataset.th=t=='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t}
function hdr(){$('#st').textContent=(token?'Drive bağlı':'Drive bağlı değil')+(D.meta.demo?' · DEMO':'')+(D.meta.dirty&&D.meta.dirty>D.meta.sync?' · kaydedilmemiş değişiklik':'')}
const NV=[['home','Ana sayfa'],['count','Sayım'],['move','Hareket'],['find','Stok'],['rep','Raporlar'],['prod','Ürünler'],['set','Ayarlar']];
function go(v){view=v;render()}
function render(){calc();hdr();if(view=='count'){if(S.ct)D.meta.ct=S.ct;else delete D.meta.ct;save(0)}$('#nv').innerHTML=NV.map(([k,n])=>`<button class="${k==view?'on':''} ${['move','count','find'].includes(k)?'':'x'}" onclick="go('${k}')">${IC[k]||''}<span>${n}</span></button>`).join('')+`<button class="mo" onclick="drw()">${IC.menu}<span>Menü</span></button>`;$('#app').innerHTML=VW[view]();(AF[view]||(()=>{}))();const e=$('#sc');if(e&&!S.nf)e.focus()}
/* barkod */
const scanBox=()=>`<div class="sc"><input id="sc" placeholder="Barkodu okutun veya yazıp Enter’a basın" onkeydown="if(event.key=='Enter'){onScan(this.value.trim());this.value=''}"><button onclick="cam(onScan)" title="Kamera">📷</button></div>`;
function onScan(c){if(!c)return;if(view=='find'){S.f.q=c;render();return}resolve(c,v=>{if(view=='move'){if(D.meta.mfast){cartAdd(v.id,1);render()}else{S.mv.v=v.id;render();$('#mQ').focus();$('#mQ').select()}}else if(view=='count'){if(D.meta.fast){S.ct.it[v.id]=(S.ct.it[v.id]||0)+1;S.ct.v=v.id;render()}else{S.ct.v=v.id;render();$('#cQ').focus();$('#cQ').select()}}})}
function resolve(c,cb){const v=byCode(c);if(v){beep();return cb(v)}beep(0);newVar(c,cb)}
function newVar(c,cb){S.cb=cb;S.code=c;modal(`<h3>Yeni ürün: ${esc(c)}</h3><small>Bu barkod ilk kez okutuldu. Bilgileri bir kez girin.</small><label>Marka</label><input id="nb" list="bl" oninput="refM('nb')"><label>Model</label><input id="nm" list="ml" onfocus="refM('nb')"><label>Kategori</label><input id="ng" list="gl"><div class="row"><div><label>Beden</label><input id="ns" list="sl"></div><div><label>Renk</label><input id="nc" list="cl"></div></div>${dlists()}<button class="bt" onclick="saveVar()">Kaydet</button> <button class="sb" onclick="closeM()">Vazgeç</button>`)}
function dlists(){return `<datalist id="ml"></datalist><datalist id="cl">${[...new Set(D.v.map(v=>v.c))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="sl">${[...new Set(D.v.map(v=>v.s))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="bl">${[...new Set(D.p.map(p=>p.b))].map(b=>`<option value="${esc(b)}">`).join('')}</datalist><datalist id="gl">${[...new Set(D.p.map(p=>p.g).filter(Boolean))].map(b=>`<option value="${esc(b)}">`).join('')}</datalist>`}
function saveVar(){const b=$('#nb').value.trim(),m=$('#nm').value.trim(),s=$('#ns').value.trim(),c=$('#nc').value.trim();if(!b||!m||!s||!c)return toast('Marka, model, beden ve renk gerekli');const v=gv(gp(b,m,$('#ng').value.trim()),s,c);if(!v.k.includes(S.code))v.k.push(S.code);save();closeM();render();S.cb(v)}
let cs,ci,cl,ct;async function cam(cb){if(!('BarcodeDetector' in window))return toast('Bu tarayıcı kamerayla okumayı desteklemiyor. Telefonda Chrome kullanın.');try{const bd=new BarcodeDetector();cs=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});modal(`<video id="vd" autoplay playsinline muted style="width:100%;border-radius:8px"></video><button class="bt" onclick="closeM()">Kapat</button>`);const v=$('#vd');v.srcObject=cs;ci=setInterval(async()=>{try{const r=await bd.detect(v);if(r.length){const c=r[0].rawValue;if(D.meta.camk){if(c==cl&&Date.now()-ct<1800)return;cl=c;ct=Date.now();cb(c)}else{closeM();cb(c)}}}catch(e){}},300)}catch(e){toast('Kamera açılamadı: izin verin')}}
function stopCam(){clearInterval(ci);cs?.getTracks().forEach(t=>t.stop());cs=null}
/* görünümler */
const mrow=m=>[dt(m.t),vn(m.v),esc(Lr(m.l)),m.q,esc(m.ty)];
const VW={home:()=>{const tq=D.m.reduce((a,m)=>a+m.q,0);return `<div class="g">${[['Toplam stok',tq],['Çeşit',D.v.length],['Model',D.p.length],['Hareket',D.m.length]].map(([a,b])=>`<div class="cd"><small>${a}</small><b>${b}</b></div>`).join('')}</div><div class="g">${D.l.map(l=>`<div class="cd"><small>${esc(l.n)}</small><b>${D.v.reduce((a,v)=>a+qty(v.id,l.id),0)}</b></div>`).join('')}</div><h3>Son hareketler</h3>`+tbl(['Tarih','Ürün','Konum','Adet','Tür'],D.m.slice(-8).reverse().map(mrow),1)},
move:()=>{const m=S.mv||(S.mv={d:'in'});m.l=m.l||D.l[0].id;m.l2=m.l2||D.l[1]?.id;m.t=m.t||TY.in[0]&&D.types[m.d]?.[0];return `<div class="tabs">${[['in','Giriş'],['out','Çıkış'],['tr','Transfer']].map(([k,n])=>`<button class="${m.d==k?'on':''}" onclick="S.mv.d='${k}';S.mv.v=null;S.mv.t=null;render()">${n}</button>`).join('')}</div><div class="cd"><label>${m.d=='tr'?'Nereden':'Konum'}</label>${lo('mL',m.l,"S.mv.l=this.value;render()")}${m.d=='tr'?`<label>Nereye</label>${lo('mL2',m.l2,"S.mv.l2=this.value")}`:`<label>Tür</label>${sel('mT',D.types[m.d].map(t=>[t,t]),m.t,"S.mv.t=this.value")}`}${scanBox()}${pickBox()}<div id="pick">${m.v?`<b>${vn(m.v)}</b><br><small>Bu konumda stok: ${qty(m.v,m.l)}</small>`:'<small>Barkod okutun</small>'}</div><label>Adet</label><input id="mQ" type="number" min="1" value="1" onkeydown="if(event.key=='Enter')doMove()"><label>Not</label><input id="mN"><label>Tarih ve saat</label><input id="mD" type="datetime-local" value="${m.dt||nowL()}" onchange="S.mv.dt=this.value"><button class="bt" onclick="doMove()">Kaydet</button> <button class="sb" onclick="addCart()">Listeye ekle</button>${cartV()}</div><h3>Son hareketler</h3>`+tbl(['Tarih','Ürün','Konum','Adet','Tür',''],D.m.slice(-15).reverse().map(mrow2),1)},

async function imp(f){if(!f)return;const R=/\.xlsx?$/i.test(f.name)?await xr(f):parse(await f.text()),H=R.shift().map(x=>x.trim().toLowerCase()),ix=n=>H.indexOf(n),err=[];let ok=0;if(['marka','model','beden','renk'].some(n=>ix(n)<0))return toast('Başlıklar şablondakiyle aynı olmalı');
R.forEach((r,i)=>{const g=n=>(r[ix(n)]||'').trim(),b=g('marka'),m=g('model'),s=g('beden'),c=g('renk'),k=g('barkod'),lk=g('konum'),a=g('adet');if(!b||!m||!s||!c)return err.push(`Satır ${i+2}: marka/model/beden/renk eksik`);let l,n=0;if(a){n=+a.replace(',','.');if(!(n>0))return err.push(`Satır ${i+2}: adet geçersiz`);l=D.l.find(x=>x.n.toLowerCase()==lk.toLowerCase());if(!l)return err.push(`Satır ${i+2}: konum bulunamadı (${lk})`)}const v=gv(gp(b,m,g('kategori')),s,c);if(k&&!v.k.includes(k)){if(byCode(k))return err.push(`Satır ${i+2}: barkod başka üründe`);v.k.push(k)}if(n)mv(v.id,l.id,n,'Açılış stoku','İçe aktarım');ok++});
save();render();modal(`<h3>İçe aktarım bitti</h3><p>${ok} satır alındı, ${err.length} satır atlandı.</p>${err.slice(0,30).map(e=>`<div><small>${esc(e)}</small></div>`).join('')}<button class="bt" onclick="closeM()">Tamam</button>`)}

async function kaydet(){if(D.meta.demo&&!confirm('Demo veri yüklü. Yine de Drive’a yazılsın mı?'))return;try{if(!token)await login();const f=(await files())[0],t=f?Date.parse(f.createdTime):0;
if(t>D.meta.sync){if(D.meta.dirty){if(confirm('Drive’da bu cihazda olmayan daha yeni bir sürüm var ve bu cihazda da kaydedilmemiş değişiklik var.\n\nTamam: Drive sürümünü yükle (bu cihazdaki önce yedek olarak indirilir)\nİptal: bu cihazdakini koru, Drive’a yeni sürüm olarak yaz'))return await pull(f.id,t)}else if(confirm('Drive’da daha yeni bir sürüm var. Yüklensin mi?'))return await pull(f.id,t)}
if(!D.meta.dirty&&D.meta.sync)return toast('Değişiklik yok');await upload();toast('Drive’a kaydedildi')}catch(e){toast('Drive: '+(e.message||e.error||'hata'))}}

<script>
const mrow2=m=>[...mrow(m),m.ty=='İptal'?'':m.c?'<small>iptal edildi</small>':`<a onclick="mcancel('${m.id}')">iptal</a>`];
function plist(){const q=($('#pq')?.value||'').toLowerCase();const r=D.p.filter(p=>(p.b+' '+p.m).toLowerCase().includes(q)).slice(0,100);$('#pl').innerHTML=tbl(['Marka','Model','Kategori','Çeşit',''],r.map(p=>[esc(p.b),esc(p.m)+(p.x?' <small>(pasif)</small>':''),esc(p.g),D.v.filter(v=>v.p==p.id).length,`<a onclick="pedit('${p.id}')">düzenle</a>`]),1)}
function pedit(id){const p=P(id),vs=D.v.filter(v=>v.p==id);S.pe=id;modal(`<h3>Model düzenle</h3>${dlists()}<label>Marka</label><input id="eB" list="bl" oninput="refM('eB')" value="${esc(p.b)}"><label>Model</label><input id="eM" list="ml" onfocus="refM('eB')" value="${esc(p.m)}"><label>Kategori</label><input id="eG" list="gl" value="${esc(p.g)}"><label>Minimum stok (boşsa genel eşik)</label><input id="eN" type="number" min="0" value="${p.mn??''}"><h3>Çeşitler</h3><small>Beden, renk ve barkodları (virgülle) değiştirebilirsiniz.</small>`+vs.map(v=>`<div class="cd" style="margin-top:8px"><div class="row"><div><label>Beden</label><input data-v="${v.id}" data-f="s" value="${esc(v.s)}"></div><div><label>Renk</label><input data-v="${v.id}" data-f="c" value="${esc(v.c)}"></div></div><label>Barkodlar</label><input data-v="${v.id}" data-f="k" value="${esc(v.k.join(', '))}"><p><small>Stok: ${tot(v.id)}${v.x?' · pasif':''}</small> · <a onclick="vmerge('${v.id}')">birleştir</a> · <a onclick="vdel('${v.id}')">${D.m.some(m=>m.v==v.id)?(v.x?'aktif yap':'pasif yap'):'sil'}</a></p></div>`).join('')+`<button class="bt" onclick="psave()">Kaydet</button> <button class="sb" onclick="pmerge('${id}')">Başka modelle birleştir</button> <button class="sb" onclick="pdel('${id}')">${vs.some(v=>D.m.some(m=>m.v==v.id))?(p.x?'Modeli aktif yap':'Modeli pasif yap'):'Modeli sil'}</button> <button class="sb" onclick="closeM()">Kapat</button>`)}
function psave(){const p=P(S.pe),b=$('#eB').value.trim(),m=$('#eM').value.trim();if(!b||!m)return toast('Marka ve model boş olamaz');if(D.p.find(x=>x.id!=p.id&&x.b.toLowerCase()==b.toLowerCase()&&x.m.toLowerCase()==m.toLowerCase()))return toast('Bu marka-model zaten var. “Başka modelle birleştir”i kullanın');const vs={};document.querySelectorAll('[data-v]').forEach(i=>{(vs[i.dataset.v]||(vs[i.dataset.v]={}))[i.dataset.f]=i.value.trim()});const seen=new Set();for(const id in vs){const x=vs[id];if(!x.s||!x.c)return toast('Beden ve renk boş olamaz');const key=(x.s+'|'+x.c).toLowerCase();if(seen.has(key))return toast('Aynı beden-renk iki kez var: '+x.s+' '+x.c+'. “birleştir”i kullanın');seen.add(key);for(const k of x.k.split(',').map(z=>z.trim()).filter(Boolean)){const o=byCode(k);if(o&&o.id!=id)return toast('Barkod başka üründe: '+k)}}
p.b=b;p.m=m;p.g=$('#eG').value.trim();p.mn=$('#eN').value===''?undefined:+$('#eN').value;for(const id in vs){const v=V(id);v.s=vs[id].s;v.c=vs[id].c;v.k=vs[id].k.split(',').map(z=>z.trim()).filter(Boolean)}save();closeM();render();toast('Kaydedildi')}
function vdel(id){const v=V(id);if(D.m.some(m=>m.v==id)){v.x=v.x?0:1;toast(v.x?'Pasif yapıldı':'Aktif yapıldı')}else{if(!confirm('Bu çeşit silinsin mi?'))return;D.v=D.v.filter(x=>x.id!=id)}save();calc();pedit(v.p)}
function pdel(id){const p=P(id),vs=D.v.filter(v=>v.p==id);if(vs.some(v=>D.m.some(m=>m.v==v.id))){p.x=p.x?0:1;toast(p.x?'Model pasif yapıldı':'Model aktif yapıldı');save();pedit(id);return}if(!confirm('Model ve çeşitleri silinsin mi?'))return;D.v=D.v.filter(v=>v.p!=id);D.p=D.p.filter(x=>x.id!=id);save();closeM();render()}
function vmerge(id){const v=V(id),o=D.v.filter(x=>x.p==v.p&&x.id!=id);if(!o.length)return toast('Birleştirilecek başka çeşit yok');modal(`<h3>Çeşit birleştir</h3><p>${esc(vr(v))} kaydı seçtiğiniz çeşidin içine katılır. Stok ve hareketler birleşir, bu çeşit silinir.</p><label>Hedef çeşit</label>${sel('mgT',o.map(x=>[x.id,x.s+' · '+x.c]),o[0].id)}<button class="bt" onclick="domerge('${id}',$('#mgT').value)">Birleştir</button> <button class="sb" onclick="pedit('${v.p}')">Vazgeç</button>`)}
function domerge(a,b){const x=V(a),y=V(b);D.m.forEach(m=>{if(m.v==a)m.v=b});x.k.forEach(k=>{if(!y.k.includes(k))y.k.push(k)});D.v=D.v.filter(v=>v.id!=a);save();calc();pedit(y.p);toast('Birleştirildi')}
function pmerge(id){const p=P(id),o=D.p.filter(x=>x.id!=id).sort((a,b)=>(a.b+a.m).localeCompare(b.b+b.m));if(!o.length)return toast('Başka model yok');modal(`<h3>Model birleştir</h3><p>${esc(p.b+' '+p.m)} modeli seçtiğiniz modelin içine katılır. Aynı beden-renkteki çeşitler birleşir, stok ve hareketler korunur.</p><label>Hedef model</label>${sel('mgP',o.map(x=>[x.id,x.b+' '+x.m]),o[0].id)}<button class="bt" onclick="dopm('${id}',$('#mgP').value)">Birleştir</button> <button class="sb" onclick="pedit('${id}')">Vazgeç</button>`)}
function dopm(a,b){D.v.filter(v=>v.p==a).forEach(v=>{const y=D.v.find(x=>x.p==b&&x.s.toLowerCase()==v.s.toLowerCase()&&x.c.toLowerCase()==v.c.toLowerCase());if(y){D.m.forEach(m=>{if(m.v==v.id)m.v=y.id});v.k.forEach(k=>{if(!y.k.includes(k))y.k.push(k)});D.v=D.v.filter(z=>z.id!=v.id)}else v.p=b});D.p=D.p.filter(p=>p.id!=a);save();closeM();render();toast('Modeller birleştirildi')}
function mcancel(id){const m=D.m.find(x=>x.id==id);if(!m||m.c)return;const g=m.r?D.m.filter(x=>x.r==m.r&&!x.c):[m];if(!confirm('Bu hareket iptal edilsin mi? Ters bir kayıt eklenir, eski kayıt silinmez.'))return;g.forEach(x=>{x.c=1;D.m.push({id:uid(),t:Date.now(),v:x.v,l:x.l,q:-x.q,ty:'İptal',ot:x.ty,n:'İptal: '+(x.n||x.ty),r:x.r||'',c:1})});save();render();toast('İptal edildi')}

<script>

function pager(k,el,h,rows,fn){const s=PG[k]||(PG[k]={n:10,p:0,sc:-1,sd:1});if(s.hk!==h.join()){s.hk=h.join();s.sc=-1}Object.assign(s,{el,h,rows,fn});let a=rows.map(fn);const kk=x=>{const t=String(x).replace(/<[^>]*>/g,'').trim(),m=t.match(/^(\d\d)\.(\d\d)\.(\d{4}) (\d\d):(\d\d)$/);if(m)return +(m[3]+m[2]+m[1]+m[4]+m[5]);return /^[-+]?\d+$/.test(t)?+t:t};if(s.sc>=0)a.sort((x,y)=>{const u=kk(x[s.sc]),w=kk(y[s.sc]);return(typeof u=='number'&&typeof w=='number'?u-w:String(u).localeCompare(String(w),'tr'))*s.sd});const np=Math.max(1,Math.ceil(a.length/s.n));if(s.p>=np)s.p=np-1;const g=`pager('${k}',PG['${k}'].el,PG['${k}'].h,PG['${k}'].rows,PG['${k}'].fn)`;$(el).innerHTML=`<small>${a.length} kayıt</small>`+tbl(h.map((x,i)=>x?`<a onclick="PG['${k}'].sd=PG['${k}'].sc==${i}?-PG['${k}'].sd:1;PG['${k}'].sc=${i};PG['${k}'].p=0;${g}" style="color:inherit;text-decoration:none;cursor:pointer">${x}${s.sc==i?(s.sd>0?' ▲':' ▼'):''}</a>`:x),a.slice(s.p*s.n,s.p*s.n+s.n),1)+`<div class="pgn"><span>Sayfa başına</span>${sel('',[10,20,30].map(x=>[x,x]),s.n,`PG['${k}'].n=+this.value;PG['${k}'].p=0;${g}`)}<button class="sb" onclick="PG['${k}'].p--;${g}" ${s.p?'':'disabled'}>‹</button><span>${s.p+1} / ${np}</span><button class="sb" onclick="PG['${k}'].p++;${g}" ${s.p<np-1?'':'disabled'}>›</button></div>`}
